<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RawCore.AI</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 L28 10 L28 22 L16 30 L4 22 L4 10 Z' fill='none' stroke='%233b82f6' stroke-width='2'/%3E%3Cpath d='M16 8 L22 12 L22 20 L16 24 L10 20 L10 12 Z' fill='%233b82f6'/%3E%3C/svg%3E">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b82f6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RawCore.AI">
    <!-- CSS: Tailwind for layout, Monospace fonts for 'Raw' look -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Fira Code', monospace; background-color: #0d1117; color: #e6edf3; }
        .markdown-body pre { background: #161b22; padding: 1rem; border-radius: 5px; overflow-x: auto; position: relative; }
        .glass { background: rgba(22, 27, 34, 0.8); backdrop-filter: blur(10px); border: 1px solid #30363d; }
        .chat-scroll::-webkit-scrollbar { width: 5px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
        .hidden { display: none !important; }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #3498db; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .code-copy-btn { position: absolute; top: 5px; right: 5px; font-size: 10px; background: #30363d; padding: 2px 6px; border-radius: 4px; color: #8b949e; cursor: pointer; }
        .code-copy-btn:hover { background: #444c56; color: #fff; }
        
        /* Smooth scrolling for chat window */
        #chat-window { scroll-behavior: smooth; }
        
        /* Utility for hiding scrollbars but keeping functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media (max-width: 768px) {
            .sidebar-mobile { position: fixed; z-index: 40; height: 100%; transform: translateX(-100%); transition: transform 0.3s; width: 85%; max-width: 320px; }
            .sidebar-mobile.open { transform: translateX(0); box-shadow: 0 0 50px rgba(0,0,0,0.8); }
            .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 35; }
            .sidebar-overlay.open { display: block; }
        }

        /* TV and Ultra-wide optimization */
        @media (min-width: 1920px) {
            .max-wide-container { max-width: 1400px; margin: 0 auto; width: 100%; border-left: 1px solid #30363d; border-right: 1px solid #30363d; }
        }

        /* Print Styles for PDF Export */
        @media print {
            aside, header, #admin-btn, #mic-btn, #send-btn, .border-t, .model-selectors, #ai-loading, .code-copy-btn, .code-copy-btn + button, label {
                display: none !important;
            }
            body, main, #chat-window, .max-wide-container {
                background: white !important;
                color: black !important;
                height: auto !important;
                overflow: visible !important;
            }
            #chat-window {
                padding: 0 !important;
            }
            .markdown-body {
                color: black !important;
            }
            .glass, .bg-gray-800, .bg-gray-900 {
                background: white !important;
                border: 1px solid #eee !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
            }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Splash / Loading Screen -->
    <div id="splash-screen" class="fixed inset-0 z-[60] flex flex-col items-center justify-center bg-[#0d1117] transition-opacity duration-500">
        <div class="relative w-24 h-24 mb-6">
            <svg class="w-full h-full animate-pulse" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                <path d="M16 2 L28 10 L28 22 L16 30 L4 22 L4 10 Z" fill="none" stroke="#3b82f6" stroke-width="1"/>
                <path d="M16 8 L22 12 L22 20 L16 24 L10 20 L10 12 Z" fill="#3b82f6" class="animate-bounce" style="animation-duration: 2s;"/>
            </svg>
            <div class="absolute inset-0 border-2 border-blue-500/20 rounded-full animate-ping"></div>
        </div>
        <div class="font-mono text-blue-400 text-sm tracking-[0.2em] animate-pulse">INITIALIZING_RAWCORE_CORE...</div>
        <div id="splash-status" class="mt-4 text-[10px] text-gray-500 font-mono uppercase">CONNECTING_TO_DATABASE</div>
    </div>

    <!-- Auth Overlay -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-black p-4 overflow-y-auto hidden">
        <div class="glass p-6 md:p-8 rounded-lg w-full max-w-md my-auto">
            <h2 class="text-2xl mb-6 font-bold text-blue-400">RAWCORE_LOGIN</h2>
            <input type="email" id="auth-email" placeholder="Email" class="w-full bg-transparent border border-gray-700 p-2 mb-4 rounded">
            <div class="relative">
                <input type="password" id="auth-password" placeholder="Password" class="w-full bg-transparent border border-gray-700 p-2 mb-4 rounded">
                <button onclick="togglePassword()" class="absolute right-2 top-2 text-xs text-gray-500">VIEW</button>
            </div>
            <div class="flex gap-2">
                <button onclick="handleAuth('login')" class="flex-1 bg-blue-600 p-2 rounded hover:bg-blue-700">LOGIN</button>
                <button onclick="handleAuth('signup')" class="flex-1 border border-blue-600 p-2 rounded hover:bg-blue-900">SIGNUP</button>
            </div>
        </div>
    </div>

    <!-- Main Navigation -->
    <header class="border-b border-gray-800 p-2 sm:p-3 md:p-4 flex justify-between items-center bg-black">
        <div class="flex items-center gap-1 sm:gap-3 overflow-hidden">
            <button onclick="toggleSidebar()" class="md:hidden text-gray-400 text-xl p-2" aria-label="Menu">☰</button>
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 L28 10 L28 22 L16 30 L4 22 L4 10 Z' fill='none' stroke='%233b82f6' stroke-width='2'/%3E%3Cpath d='M16 8 L22 12 L22 20 L16 24 L10 20 L10 12 Z' fill='%233b82f6'/%3E%3C/svg%3E" class="w-5 h-5 md:w-6 md:h-6 shrink-0" alt="Logo">
            <div class="font-bold text-base sm:text-lg md:text-xl tracking-tighter truncate">RawCore.AI <span class="hidden xs:inline">[BETA]</span></div>
        </div>
        <div class="flex gap-1 md:gap-3 items-center shrink-0">
            <button onclick="togglePanel('admin-panel')" id="admin-btn" class="hidden text-[9px] sm:text-xs text-yellow-500 border border-yellow-500 px-1 sm:px-2 py-1 rounded">ADMIN</button>
            <button onclick="logout()" class="text-[9px] sm:text-xs text-red-500 border border-red-500 px-1 sm:px-2 py-1 rounded">LOGOUT</button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden relative bg-[#0d1117]">
        <!-- Sidebar Overlay (Mobile) -->
        <div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

        <!-- Sidebar: History -->
        <aside id="sidebar" class="sidebar-mobile border-r border-gray-800 flex flex-col p-4 space-y-4 bg-[#0d1117] md:w-64 md:translate-x-0 md:static">
            <button onclick="createNewChat(); toggleSidebar();" class="w-full border border-gray-600 p-2 hover:bg-gray-800 rounded text-sm">+ NEW_CHAT</button>
            <div id="chat-history" class="flex-1 overflow-y-auto space-y-2 text-[11px] md:text-xs text-gray-400">
                <!-- Chats will be injected here -->
            </div>
            
            <!-- Export Dropdown -->
            <div class="relative mt-auto pt-2" id="export-dropdown-container">
                <button onclick="toggleExportMenu()" class="text-xs text-blue-400 underline text-left flex items-center gap-1 uppercase tracking-tighter">
                    EXPORT_CONVERSATION
                    <svg class="w-3 h-3 transition-transform duration-200" id="export-arrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="export-menu" class="absolute left-0 w-48 bg-[#161b22] border border-gray-700 rounded shadow-2xl hidden z-50 overflow-hidden">
                    <button onclick="exportChat('md')" class="w-full text-left p-3 text-[10px] hover:bg-gray-800 border-b border-gray-800 transition-colors">AS_MARKDOWN (.md)</button>
                    <button onclick="exportChat('txt')" class="w-full text-left p-3 text-[10px] hover:bg-gray-800 border-b border-gray-800 transition-colors">AS_PLAIN_TEXT (.txt)</button>
                    <button onclick="exportChat('pdf')" class="w-full text-left p-3 text-[10px] hover:bg-gray-800 border-b border-gray-800 transition-colors">AS_PDF (Browser Print)</button>
                    <button onclick="exportChat('clipboard')" class="w-full text-left p-3 text-[10px] hover:bg-gray-800 transition-colors">COPY_TO_CLIPBOARD</button>
                </div>
            </div>
        </aside>

        <!-- Chat Area -->
        <section class="flex-1 flex flex-col relative w-full min-w-0 max-wide-container bg-black/20">
            <!-- Model Selectors -->
            <div class="px-2 sm:px-4 py-2 border-b border-gray-800 flex gap-2 sm:gap-4 overflow-x-auto whitespace-nowrap no-scrollbar items-center bg-black/50">
                <div class="flex items-center gap-1">
                    <span class="text-[8px] sm:text-[10px] text-gray-500 uppercase tracking-widest font-bold">MODEL:</span>
                    <select id="text-model-select" class="bg-gray-900 text-[10px] sm:text-xs border border-gray-700 rounded p-1 focus:outline-none max-w-[120px] sm:max-w-none"></select>
                </div>
                <div class="flex items-center gap-1">
                    <span class="text-[8px] sm:text-[10px] text-gray-500 uppercase tracking-widest font-bold">VOICE:</span>
                    <select id="stt-model-select" class="bg-gray-900 text-[10px] sm:text-xs border border-gray-700 rounded p-1 focus:outline-none max-w-[120px] sm:max-w-none"></select>
                </div>
            </div>

            <div id="chat-window" class="flex-1 overflow-y-auto p-3 md:p-6 space-y-4 md:space-y-6 chat-scroll">
                <!-- Messages -->
            </div>

            <!-- Loading Indicator -->
            <div id="ai-loading" class="hidden px-6 py-2 flex items-center gap-2 text-xs text-blue-400">
                <div class="loader"></div> <span>AI_PROCESSING...</span>
            </div>

            <!-- Input Area -->
            <div class="p-2 sm:p-4 border-t border-gray-800">
                <div id="attachment-preview" class="flex flex-wrap gap-2 mb-2"></div>
                <div class="flex items-end gap-1 sm:gap-2 glass p-1 sm:p-2 rounded-lg">
                    <label class="cursor-pointer p-2 hover:bg-gray-800 rounded flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                        <input type="file" id="file-input" class="hidden" multiple onchange="handleFiles(this.files)">
                    </label>
                    <textarea id="user-input" rows="1" class="flex-1 bg-transparent resize-none p-2 focus:outline-none text-[13px] sm:text-sm min-h-[40px] max-h-[200px]" placeholder="Ask anything..." onkeydown="if(event.key === 'Enter' && !event.shiftKey){ event.preventDefault(); handleSendAction(); }"></textarea>
                    <button onclick="startSpeech()" id="mic-btn" class="p-2 hover:bg-gray-800 rounded flex items-center justify-center shrink-0">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    </button>
                    <button onclick="handleSendAction()" id="send-btn" class="bg-blue-600 px-3 sm:px-4 py-2 rounded font-bold hover:bg-blue-500 text-[11px] sm:text-sm whitespace-nowrap shrink-0">SEND</button>
                </div>
            </div>
        </section>
    </main>

    <!-- Admin Panel Modal -->
    <div id="admin-panel" class="fixed inset-0 z-50 bg-black bg-opacity-90 hidden p-4 md:p-10 overflow-y-auto">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-6 md:mb-8">
                <h2 class="text-xl md:text-3xl font-bold">ADMIN_CONFIGURATION</h2>
                <button onclick="togglePanel('admin-panel')" class="text-red-500 font-bold text-sm">[CLOSE]</button>
            </div>
            
            <div class="space-y-4 md:space-y-6">
                <div>
                    <label class="block text-xs md:text-sm text-gray-400 uppercase">GEMINI_API_KEYS</label>
                    <textarea id="admin-gemini-keys" class="w-full bg-gray-900 border border-gray-700 p-2 rounded mt-1 h-16 md:h-20 text-sm" placeholder="key1, key2"></textarea>
                </div>
                <div>
                    <label class="block text-xs md:text-sm text-gray-400 uppercase">GROQ_API_KEYS</label>
                    <textarea id="admin-groq-keys" class="w-full bg-gray-900 border border-gray-700 p-2 rounded mt-1 h-16 md:h-20 text-sm" placeholder="key1, key2"></textarea>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs md:text-sm text-gray-400 uppercase">TEXT_MODELS (provider:name)</label>
                        <textarea id="admin-text-models" class="w-full bg-gray-900 border border-gray-700 p-2 rounded mt-1 h-20 md:h-24 text-sm" placeholder="gemini:gemini-1.5-flash, groq:llama3-8b-8192"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs md:text-sm text-gray-400 uppercase">STT_MODELS (provider:name)</label>
                        <textarea id="admin-stt-models" class="w-full bg-gray-900 border border-gray-700 p-2 rounded mt-1 h-20 md:h-24 text-sm" placeholder="groq:whisper-large-v3, gemini:speech-to-text"></textarea>
                    </div>
                </div>
                <button onclick="saveAdminSettings()" class="w-full bg-green-600 p-3 rounded font-bold">SAVE_CONFIG</button>
            </div>
        </div>
    </div>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW_REGISTERED', reg.scope))
                    .catch(err => console.error('SW_REGISTRATION_FAILED', err));
            });
        }
    </script>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, collection, addDoc, query, where, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyB_2SivXvzam33aOyAxAD1S259mYKbS0zs",
            authDomain: "ems-react-eb975.firebaseapp.com",
            projectId: "ems-react-eb975",
            storageBucket: "ems-react-eb975.firebasestorage.app",
            messagingSenderId: "832754328611",
            appId: "1:832754328611:web:4ca522e85564bab7fd7d96"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State
        let currentUser = null;
        let currentChatId = null;
        let config = { geminiKeys: [], groqKeys: [], textModels: [], sttModels: [] };
        let currentGeminiKeyIndex = 0;
        let currentGroqKeyIndex = 0;
        let isGenerating = false;
        let currentAbortController = null;

        // --- MARKED CUSTOMIZATION ---
        const renderer = new marked.Renderer();
        renderer.code = function(token, lang, escaped) {
            // Support both older and newer versions of marked.js
            const codeContent = typeof token === 'object' ? token.text : token;
            const language = typeof token === 'object' ? token.lang : lang;
            
            const id = 'code-' + Math.random().toString(36).substr(2, 9);
            return `<div class="relative group">
                <pre><code class="language-${language || ''}" id="${id}">${codeContent}</code></pre>
                <button onclick="window.copyToClipboard('${id}')" class="code-copy-btn">COPY</button>
            </div>`;
        };
        marked.setOptions({ renderer: renderer });

        window.copyToClipboard = (id) => {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text);
            const btn = window.event ? (window.event.currentTarget || window.event.target) : null;
            if (btn && (btn.tagName === 'BUTTON' || btn.closest('button'))) {
                const target = btn.tagName === 'BUTTON' ? btn : btn.closest('button');
                const original = target.innerText;
                target.innerText = "COPIED!";
                setTimeout(() => target.innerText = original, 2000);
            }
        };

        window.toggleSidebar = () => {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('open');
        };

        window.toggleExportMenu = () => {
            const menu = document.getElementById('export-menu');
            const arrow = document.getElementById('export-arrow');
            const container = document.getElementById('export-dropdown-container');
            
            const isHidden = menu.classList.contains('hidden');
            
            if (!isHidden) {
                menu.classList.add('hidden');
                arrow.style.transform = '';
                return;
            }

            // Boundary awareness logic
            const rect = container.getBoundingClientRect();
            const spaceBelow = window.innerHeight - rect.bottom;
            const spaceAbove = rect.top;
            const menuHeight = 180; // Estimated max height

            if (spaceBelow < menuHeight && spaceAbove > spaceBelow) {
                // Open Up
                menu.style.bottom = '100%';
                menu.style.top = 'auto';
                menu.classList.remove('mt-2');
                menu.classList.add('mb-2');
            } else {
                // Open Down
                menu.style.top = '100%';
                menu.style.bottom = 'auto';
                menu.classList.remove('mb-2');
                menu.classList.add('mt-2');
            }

            menu.classList.remove('hidden');
            arrow.style.transform = 'rotate(180deg)';

            // Global click to close
            const closeMenu = (e) => {
                if (!container.contains(e.target)) {
                    menu.classList.add('hidden');
                    arrow.style.transform = '';
                    document.removeEventListener('click', closeMenu);
                }
            };
            setTimeout(() => document.addEventListener('click', closeMenu), 1);
        };

        // --- AUTH FUNCTIONS ---
        window.handleAuth = async (type) => {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-password').value;
            try {
                if (type === 'login') {
                    await signInWithEmailAndPassword(auth, email, pass);
                } else {
                    const cred = await createUserWithEmailAndPassword(auth, email, pass);
                    // Initialize user profile in Firestore
                    await setDoc(doc(db, "users", cred.user.uid), {
                        email: email,
                        isAdmin: false, // Default to non-admin
                        createdAt: Date.now()
                    });
                }
                document.getElementById('auth-screen').classList.add('hidden');
            } catch (e) { alert(e.message); }
        };

        window.logout = () => signOut(auth);

        window.togglePassword = () => {
            const el = document.getElementById('auth-password');
            el.type = el.type === 'password' ? 'text' : 'password';
        };

        onAuthStateChanged(auth, async (user) => {
            const splash = document.getElementById('splash-screen');
            const authScreen = document.getElementById('auth-screen');
            const status = document.getElementById('splash-status');

            if (user) {
                status.innerText = "AUTHENTICATED_OK...LOADING_PROFILE";
                currentUser = user;
                authScreen.classList.add('hidden');
                
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists() && userDoc.data().isAdmin === true) {
                        document.getElementById('admin-btn').classList.remove('hidden');
                    } else {
                        document.getElementById('admin-btn').classList.add('hidden');
                    }
                } catch (err) {
                    document.getElementById('admin-btn').classList.add('hidden');
                }

                await loadConfig();
                await loadChatHistory();
            } else {
                status.innerText = "NO_SESSION_FOUND...REDIRECTING_TO_LOGIN";
                currentUser = null;
                currentChatId = null;
                document.getElementById('chat-window').innerHTML = '';
                document.getElementById('chat-history').innerHTML = '';
                authScreen.classList.remove('hidden');
                document.getElementById('admin-btn').classList.add('hidden');
            }

            // Smooth fade out splash
            setTimeout(() => {
                splash.classList.add('opacity-0');
                setTimeout(() => splash.classList.add('hidden'), 500);
            }, 800);
        });

        // --- ADMIN FUNCTIONS ---
        async function loadConfig() {
            const docRef = doc(db, "settings", "main");
            const docSnap = await getDoc(docRef);
            if (docSnap.exists()) {
                config = docSnap.data();
                populateSelectors();
            }
        }

        window.saveAdminSettings = async () => {
            const data = {
                geminiKeys: document.getElementById('admin-gemini-keys').value.split(',').map(s => s.trim()).filter(Boolean),
                groqKeys: document.getElementById('admin-groq-keys').value.split(',').map(s => s.trim()).filter(Boolean),
                textModels: document.getElementById('admin-text-models').value.split(',').map(s => s.trim()).filter(Boolean),
                sttModels: document.getElementById('admin-stt-models').value.split(',').map(s => s.trim()).filter(Boolean),
            };
            await setDoc(doc(db, "settings", "main"), data);
            alert("Settings Saved");
            location.reload();
        };

        function populateSelectors() {
            const tSelect = document.getElementById('text-model-select');
            const sSelect = document.getElementById('stt-model-select');
            tSelect.innerHTML = config.textModels.map(m => `<option value="${m}">${m.split(':')[1] || m}</option>`).join('');
            sSelect.innerHTML = config.sttModels.map(m => `<option value="${m}">${m.split(':')[1] || m}</option>`).join('');
            
            // Fill admin fields if they are open
            document.getElementById('admin-gemini-keys').value = (config.geminiKeys || []).join(',');
            document.getElementById('admin-groq-keys').value = (config.groqKeys || []).join(',');
            document.getElementById('admin-text-models').value = (config.textModels || []).join(',');
            document.getElementById('admin-stt-models').value = (config.sttModels || []).join(',');
        }

        // --- CHAT LOGIC ---
        async function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        // Auto-resize textarea logic
        const userInput = document.getElementById('user-input');
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        window.handleSendAction = () => {
            if (isGenerating) {
                stopGeneration();
            } else {
                sendMessage();
                // Reset height after sending
                userInput.style.height = 'auto';
            }
        };

        window.stopGeneration = () => {
            if (currentAbortController) {
                currentAbortController.abort();
            }
        };

        window.sendMessage = async () => {
            const inputEl = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const text = inputEl.value.trim();
            const attachmentData = [...attachments];
            if (!text && attachmentData.length === 0) return;

            const loadingEl = document.getElementById('ai-loading');
            loadingEl.classList.remove('hidden');
            
            isGenerating = true;
            sendBtn.innerText = 'STOP';
            sendBtn.classList.replace('bg-blue-600', 'bg-red-600');
            sendBtn.classList.replace('hover:bg-blue-500', 'hover:bg-red-500');

            currentAbortController = new AbortController();

            if (!currentChatId) {
                const newChat = await addDoc(collection(db, "chats"), {
                    userId: currentUser.uid,
                    createdAt: Date.now(),
                    title: text.substring(0, 30) || (attachmentData.length > 0 ? attachmentData[0].name : "New Conversation")
                });
                currentChatId = newChat.id;
            }

            const userDisplayContent = text + (attachmentData.length > 0 ? `\n\n[ATTACHMENTS: ${attachmentData.map(f => f.name).join(', ')}]` : '');
            appendMessage('user', userDisplayContent);
            
            // Clear inputs immediately
            inputEl.value = '';
            attachments = [];
            document.getElementById('attachment-preview').innerHTML = '';
            
            const model = document.getElementById('text-model-select').value;
            
            try {
                // Save user message first to guarantee ordering in Firestore
                const userTimestamp = Date.now();
                await addDoc(collection(db, `chats/${currentChatId}/messages`), {
                    role: 'user', content: userDisplayContent, timestamp: userTimestamp
                });

                const response = await callAIWithFailover(text, attachmentData, model, currentAbortController.signal);
                appendMessage('bot', response);
                
                // Save bot response with distinct timestamp (ensuring it's after user)
                await addDoc(collection(db, `chats/${currentChatId}/messages`), {
                    role: 'bot', content: response, timestamp: userTimestamp + 10
                });
            } catch (err) {
                if (err.name === 'AbortError') {
                    appendMessage('bot', "_Generation stopped by user._");
                } else {
                    appendMessage('bot', "ERROR: " + err.message);
                }
            } finally {
                loadingEl.classList.add('hidden');
                isGenerating = false;
                sendBtn.innerText = 'SEND';
                sendBtn.classList.replace('bg-red-600', 'bg-blue-600');
                sendBtn.classList.replace('hover:bg-red-500', 'hover:bg-blue-500');
                currentAbortController = null;
            }
        };

        async function callAIWithFailover(prompt, files, modelValue, signal) {
            const [provider, modelName] = modelValue.includes(':') ? modelValue.split(':') : ['gemini', modelValue];
            const isGroq = provider.toLowerCase() === 'groq';
            const keys = isGroq ? config.groqKeys : config.geminiKeys;
            let keyIndex = isGroq ? currentGroqKeyIndex : currentGeminiKeyIndex;

            if (!keys || keys.length === 0) return `ERROR: NO KEYS CONFIGURED FOR ${provider.toUpperCase()}`;

            for (let i = 0; i < keys.length; i++) {
                if (signal && signal.aborted) throw new DOMException("Aborted", "AbortError");
                
                const idx = (keyIndex + i) % keys.length;
                const currentKey = keys[idx];
                try {
                    let response;
                    if (isGroq) {
                        const enrichedPrompt = files.length > 0 ? 
                            `${prompt}\n\n[USER ATTACHED FILES: ${files.map(f => f.name).join(', ')}]` : prompt;
                        response = await fetchGroq(enrichedPrompt, modelName, currentKey, signal);
                        currentGroqKeyIndex = idx;
                    } else {
                        response = await fetchGemini(prompt, files, modelName, currentKey, signal);
                        currentGeminiKeyIndex = idx;
                    }
                    return response;
                } catch (err) {
                    if (err.name === 'AbortError') throw err;
                    console.error(`${provider} Key ${idx} failed:`, err);
                }
            }
            return "ERROR: ALL API KEYS FAILED OR EXHAUSTED.";
        }

        async function fetchGemini(prompt, files, model, key, signal) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;
            const parts = [{ text: prompt || "Analyzing provided content..." }];
            
            for (const file of files) {
                if (file.type.startsWith('image/')) {
                    const b64 = await fileToBase64(file);
                    parts.push({ inline_data: { mime_type: file.type, data: b64 } });
                } else {
                    parts[0].text += `\n[File Attachment: ${file.name}]`;
                }
            }

            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: parts }] }),
                signal: signal
            });
            if (!res.ok) throw new Error(await res.text());
            const data = await res.json();
            return data.candidates[0].content.parts[0].text;
        }

        async function fetchGroq(prompt, model, key, signal) {
            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
                body: JSON.stringify({
                    model: model,
                    messages: [{ role: "user", content: prompt }]
                }),
                signal: signal
            });
            if (!res.ok) throw new Error(await res.text());
            const data = await res.json();
            return data.choices[0].message.content;
        }

        function appendMessage(role, content) {
            const win = document.getElementById('chat-window');
            const div = document.createElement('div');
            // Responsive margins: smaller on mobile, larger on big screens
            const marginClass = role === 'user' ? 'ml-4 sm:ml-12 md:ml-20 lg:ml-32' : 'mr-4 sm:mr-12 md:mr-20 lg:mr-32';
            div.className = `p-3 md:p-4 rounded-lg ${role === 'user' ? 'bg-gray-800' : 'bg-gray-900 border border-gray-800'} ${marginClass}`;
            
            const rawContent = document.createElement('div');
            rawContent.className = "markdown-body text-[13px] md:text-sm leading-relaxed break-words";
            rawContent.innerHTML = marked.parse(content);
            
            const copyBtn = document.createElement('button');
            copyBtn.innerHTML = `
                <div class="flex items-center gap-1">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>
                    <span>COPY_RAW</span>
                </div>
            `;
            copyBtn.className = "text-[10px] text-gray-500 mt-2 block hover:text-white transition-colors";
            copyBtn.onclick = () => {
                navigator.clipboard.writeText(content);
                const span = copyBtn.querySelector('span');
                if (span) {
                    span.innerText = "COPIED!";
                    setTimeout(() => span.innerText = "COPY_RAW", 2000);
                }
            };

            div.appendChild(rawContent);
            div.appendChild(copyBtn);
            win.appendChild(div);
            win.scrollTop = win.scrollHeight;
        }

        // --- SPEECH TO TEXT (CUSTOM API IMPLEMENTATION) ---
        let mediaRecorder = null;
        let audioChunks = [];

        window.startSpeech = async () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstart = () => {
                    document.getElementById('mic-btn').innerHTML = `
                        <svg class="w-5 h-5 text-red-500 animate-pulse" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg>
                    `;
                    document.getElementById('mic-btn').classList.add('bg-red-900/20');
                };

                mediaRecorder.onstop = async () => {
                    document.getElementById('mic-btn').innerHTML = `
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    `;
                    document.getElementById('mic-btn').classList.remove('bg-red-900/20');
                    
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioFile = new File([audioBlob], "recording.webm", { type: 'audio/webm' });
                    
                    // Stop all tracks to release the microphone
                    stream.getTracks().forEach(track => track.stop());

                    const loadingEl = document.getElementById('ai-loading');
                    loadingEl.classList.remove('hidden');
                    
                    try {
                        const transcript = await processSTT(audioFile);
                        if (transcript) {
                            const input = document.getElementById('user-input');
                            const cleanTranscript = transcript.trim();
                            if (input.value && !input.value.endsWith(' ')) {
                                input.value += ' ';
                            }
                            input.value += cleanTranscript;
                            input.focus();
                        }
                    } catch (err) {
                        alert("STT Error: " + err.message);
                    } finally {
                        loadingEl.classList.add('hidden');
                    }
                };

                mediaRecorder.start();
            } catch (err) {
                alert("Microphone access denied or not supported.");
                console.error(err);
            }
        };

        async function processSTT(audioFile) {
            const modelValue = document.getElementById('stt-model-select').value;
            const [provider, modelName] = modelValue.includes(':') ? modelValue.split(':') : ['groq', modelValue];
            const isGroq = provider.toLowerCase() === 'groq';
            const keys = isGroq ? config.groqKeys : config.geminiKeys;
            let keyIndex = isGroq ? currentGroqKeyIndex : currentGeminiKeyIndex;

            if (!keys || keys.length === 0) throw new Error(`NO KEYS CONFIGURED FOR ${provider.toUpperCase()}`);

            for (let i = 0; i < keys.length; i++) {
                const idx = (keyIndex + i) % keys.length;
                const currentKey = keys[idx];
                try {
                    if (isGroq) {
                        const formData = new FormData();
                        formData.append('file', audioFile);
                        formData.append('model', modelName || 'whisper-large-v3');
                        
                        const res = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
                            method: 'POST',
                            headers: { 'Authorization': `Bearer ${currentKey}` },
                            body: formData
                        });
                        if (!res.ok) throw new Error(await res.text());
                        const data = await res.json();
                        currentGroqKeyIndex = idx;
                        return data.text;
                    } else {
                        // Gemini STT via multimodal generateContent
                        const b64 = await fileToBase64(audioFile);
                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${currentKey}`;
                        const res = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [
                                        { text: "Transcribe this audio exactly as heard. Output ONLY the transcription text." },
                                        { inline_data: { mime_type: "audio/webm", data: b64 } }
                                    ]
                                }]
                            })
                        });
                        if (!res.ok) throw new Error(await res.text());
                        const data = await res.json();
                        currentGeminiKeyIndex = idx;
                        return data.candidates[0].content.parts[0].text;
                    }
                } catch (err) {
                    console.warn(`${provider} STT Key ${idx} failed, trying next...`, err);
                }
            }
            throw new Error("All STT API keys failed.");
        }

        // --- UTILS ---
        window.togglePanel = (id) => document.getElementById(id).classList.toggle('hidden');
        
        window.exportChat = (type) => {
            // Close menu
            const menu = document.getElementById('export-menu');
            const arrow = document.getElementById('export-arrow');
            if (menu) menu.classList.add('hidden');
            if (arrow) arrow.style.transform = '';

            const messages = Array.from(document.querySelectorAll('.markdown-body'))
                                  .map(m => m.innerText).join('\n\n---\n\n');
            
            if (!messages || messages.trim() === "") {
                alert("NO_MESSAGES_TO_EXPORT");
                return;
            }

            if (type === 'clipboard') {
                navigator.clipboard.writeText(messages);
                alert("COPIED_TO_CLIPBOARD");
                return;
            }

            if (type === 'pdf') {
                // html2pdf provides customizable client-side PDF generation (Puppeteer alternative for browsers)
                const originalWindow = document.getElementById('chat-window');
                const element = originalWindow.cloneNode(true);
                
                // CUSTOMIZATION: Modify the cloned element specifically for the PDF output
                element.style.background = 'white';
                element.style.color = 'black';
                element.style.width = '100%';
                element.style.height = 'auto';
                element.style.padding = '20px';
                element.style.fontFamily = 'serif'; // Example: change font for PDF
                
                // Remove interactive components from the export
                element.querySelectorAll('.code-copy-btn, button').forEach(el => el.remove());
                
                // Apply print-friendly styling to messages
                element.querySelectorAll('.markdown-body').forEach(mb => {
                    mb.style.color = 'black';
                    mb.style.fontSize = '12px';
                    mb.style.lineHeight = '1.5';
                    
                    // Ensure multi-line code blocks have white text since they maintain dark backgrounds
                    mb.querySelectorAll('pre').forEach(pre => {
                        pre.style.color = 'white';
                        pre.querySelectorAll('code').forEach(c => c.style.color = 'white');
                    });
                    // Inline code (code not inside pre) will inherit the black color from mb.style.color
                });

                element.querySelectorAll('.bg-gray-800, .bg-gray-900').forEach(msg => {
                    msg.style.backgroundColor = '#ffffff';
                    msg.style.borderBottom = '1px solid #eeeeee';
                    msg.style.color = 'black';
                    msg.style.margin = '15px 0';
                    msg.style.padding = '10px 0';
                    // Reset responsive chat bubbles to full width for PDF
                    msg.className = 'p-4'; 
                });

                const opt = {
                    margin:       [15, 10, 15, 10], // top, left, bottom, right
                    filename:     `RawCore_Export_${new Date().getTime()}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, logging: false, useCORS: true },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                    pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
                };

                // Generate and save
                html2pdf().set(opt).from(element).save();
                return;
            }

            const extension = type === 'md' ? 'md' : 'txt';
            const mime = type === 'md' ? 'text/markdown' : 'text/plain';
            
            const blob = new Blob([messages], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `rawcore_export_${Date.now()}.${extension}`;
            a.click();
            URL.revokeObjectURL(url);
        };

        window.createNewChat = () => {
            currentChatId = null;
            document.getElementById('chat-window').innerHTML = '';
        };

        async function loadChatHistory() {
            const q = query(collection(db, "chats"), where("userId", "==", currentUser.uid), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                const hist = document.getElementById('chat-history');
                hist.innerHTML = '';
                snapshot.forEach(chatDoc => {
                    const d = chatDoc.data();
                    const container = document.createElement('div');
                    container.className = "group flex items-center justify-between p-2 hover:bg-gray-800 rounded border border-transparent hover:border-gray-700 transition-all cursor-pointer";
                    
                    const titleBtn = document.createElement('button');
                    titleBtn.className = "flex-1 text-left truncate mr-2 text-[11px]";
                    titleBtn.innerText = d.title || "Untitled Chat";
                    titleBtn.onclick = () => loadSpecificChat(chatDoc.id);
                    
                    const actions = document.createElement('div');
                    actions.className = "flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity";
                    
                    const renBtn = document.createElement('button');
                    renBtn.innerHTML = "✎";
                    renBtn.className = "text-gray-500 hover:text-blue-400 text-xs";
                    renBtn.title = "Rename";
                    renBtn.onclick = (e) => { e.stopPropagation(); renameChat(chatDoc.id, d.title); };
                    
                    const delBtn = document.createElement('button');
                    delBtn.innerHTML = "×";
                    delBtn.className = "text-gray-500 hover:text-red-400 text-base leading-none";
                    delBtn.title = "Delete";
                    delBtn.onclick = (e) => { e.stopPropagation(); deleteChat(chatDoc.id); };

                    actions.appendChild(renBtn);
                    actions.appendChild(delBtn);
                    container.appendChild(titleBtn);
                    container.appendChild(actions);
                    hist.appendChild(container);
                });
            });
        }

        window.renameChat = async (id, oldTitle) => {
            const title = prompt("RENAME_CHAT:", oldTitle);
            if (title && title.trim() && title !== oldTitle) {
                await updateDoc(doc(db, "chats", id), { title: title.trim() });
            }
        };

        window.deleteChat = async (id) => {
            if (confirm("DELETE_CONVERSATION_PERMANENTLY?")) {
                await deleteDoc(doc(db, "chats", id));
                if (currentChatId === id) createNewChat();
            }
        };

        async function loadSpecificChat(id) {
            currentChatId = id;
            const win = document.getElementById('chat-window');
            win.innerHTML = '';
            try {
                const q = query(collection(db, `chats/${id}/messages`), orderBy("timestamp", "asc"));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    appendMessage(data.role, data.content);
                });
            } catch (err) {
                console.error("Error loading messages:", err);
            }
        }

        // Handle File Mockup (Raw approach: just logs names, requires Firebase Storage for real use)
        let attachments = [];
        window.handleFiles = (files) => {
            const preview = document.getElementById('attachment-preview');
            Array.from(files).forEach(f => {
                attachments.push(f);
                const span = document.createElement('span');
                span.className = "text-[10px] bg-gray-700 p-1 px-2 rounded flex items-center gap-1";
                span.innerHTML = `<span>${f.name}</span><button onclick="this.parentElement.remove(); attachments = attachments.filter(a => a !== f);" class="text-red-400 ml-1">×</button>`;
                preview.appendChild(span);
            });
        };

    </script>
</body>
